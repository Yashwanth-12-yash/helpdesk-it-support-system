components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_email:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_email
      - created_at
      - id
      - ip_address
      - metadata
      - resource_id
      - resource_type
      - user_agent
    CategoryEnum:
      enum:
      - HARDWARE
      - SOFTWARE
      - NETWORK
      - ACCESS
      - EMAIL
      - SECURITY
      - OTHER
      type: string
      description: |-
        * `HARDWARE` - Hardware
        * `SOFTWARE` - Software
        * `NETWORK` - Network & VPN
        * `ACCESS` - Access & Identity
        * `EMAIL` - Email & Collaboration
        * `SECURITY` - Security Incident
        * `OTHER` - Other
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - new_password
      - old_password
    ClassifyTicketInputRequest:
      type: object
      properties:
        ticket_id:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
    CustomTokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 20
        description:
          type: string
        manager:
          type: integer
          nullable: true
        manager_detail:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        team_count:
          type: integer
          readOnly: true
          default: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - manager_detail
      - name
      - team_count
      - updated_at
    DepartmentSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - code
      - id
      - is_active
      - name
    DepartmentWrite:
      type: object
