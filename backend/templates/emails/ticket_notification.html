<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ title }}</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1e293b; background-color: #f8fafc; padding: 24px;">
  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
    <div style="background-color: #0f172a; color: #ffffff; padding: 16px 24px;">
      <h2 style="margin: 0; font-size: 18px;">HelpDesk IT Support</h2>
    </div>
    <div style="padding: 24px;">
      <p style="margin-top: 0;">Hello {{ recipient_name }},</p>
      <h3 style="color: #0f172a; margin-bottom: 8px;">{{ title }}</h3>
      <p style="line-height: 1.6; color: #334155;">{{ message }}</p>
      {% if ticket_url %}
      <p style="margin-top: 24px;">
        <a href="{{ ticket_url }}" style="display: inline-block; background-color: #1d4ed8; color: #ffffff; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: 600;">
          View Ticket {{ ticket_number }}
        </a>
      </p>
      {% endif %}
    </div>
    <div style="background-color: #f1f5f9; padding: 12px 24px; font-size: 12px; color: #64748b;">
      This is an automated notification from HelpDesk IT Support Management.
    </div>
  </div>
</body>
</html>
